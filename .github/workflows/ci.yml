name: Application checks
on:
  push:
    branches: [main, feat/persistent-operations]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trippy_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: trippy_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trippy_test -d trippy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'services/api[dev]'
      - run: pytest -q services/api/tests
        env:
          APP_ENV: test
          TRIPPY_TEST_DATABASE_URL: postgresql+psycopg://trippy_test:isolated_ci_only@localhost:5432/trippy_ci
      - name: Verify migration, metadata and idempotent catalog startup
        working-directory: services/api
        run: python -c 'from scripts.start import migrate; migrate(); migrate()'
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://trippy_test:isolated_ci_only@localhost:5432/trippy_ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://trippy-delivery-api-dev-1010753880203.asia-south1.run.app
